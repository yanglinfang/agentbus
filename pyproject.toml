[project]
name = "agent-bus"
version = "0.2.2"
description = "A tiny, file-backed message bus so coding agents from different vendors can coordinate in one repo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lin Yang" }]
keywords = ["agents", "mcp", "claude-code", "codex", "cursor", "coordination"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
abus = "agentbus.cli:main"

[project.urls]
Homepage = "https://github.com/yanglinfang/agentbus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
